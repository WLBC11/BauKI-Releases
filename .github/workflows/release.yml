name: BauKI Release (oeffentlich)

# Wird vom "Veroeffentlichen"-Knopf gestartet. Holt den privaten Quellcode,
# baut Mac + Windows inkl. KI-Sidecar und legt Installer + Auto-Update-Info
# (latest.json) hier ins oeffentliche Release. Installierte Apps aktualisieren
# sich darueber selbst.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versions-Tag, z.B. v0.1.1"
        required: true
      ref:
        description: "Quell-Commit/Branch im privaten Repo"
        required: false
        default: main

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Privaten Quellcode holen
        uses: actions/checkout@v4
        with:
          repository: WLBC11/Website-BauKI
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Sidecar-Abhaengigkeiten installieren
        working-directory: ai-system/sdk_agent
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install "ifcopenshell==0.8.5"
          pip install pyinstaller
      - name: Sidecar bauen (bauki-sidecar)
        working-directory: ai-system/sdk_agent
        shell: bash
        run: pyinstaller --noconfirm bauki-sidecar.spec

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend-Abhaengigkeiten installieren
        working-directory: frontend
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Desktop-Frontend-Abhaengigkeiten installieren
        working-directory: bauki-desktop
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Rust-Build-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: bauki-desktop/src-tauri

      - name: App bauen + Auto-Update veroeffentlichen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: bauki-desktop
          tagName: ${{ inputs.version }}
          releaseName: "BauKI ${{ inputs.version }}"
          releaseBody: "Automatisch gebaut. Installierte Apps aktualisieren sich selbst."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.rust_target }}

      # Nur Mac: der Mac-Installer ist eine "Diskette" (DMG). Standardmaessig traegt
      # die Diskette dasselbe Icon wie die App -> verwechselbar. Hier bekommt NUR die
      # Diskette ein eigenes Icon (BauKI-Logo + Download-Abzeichen). Das App-Icon bleibt
      # unveraendert. Best-effort: schlaegt das fehl, bleibt der Bau trotzdem gueltig
      # (dann eben mit Standard-Diskette). Der Auto-Updater nutzt die .app.tar.gz, NICHT
      # die DMG -> dieser Schritt kann Updates nicht beeinflussen.
      - name: Diskette mit Download-Abzeichen versehen (nur Mac, best-effort)
        if: matrix.os == 'macos-14'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          ICON="bauki-desktop/src-tauri/dmg/VolumeIcon.icns"
          DMG=$(ls bauki-desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ] || [ ! -f "$ICON" ]; then
            echo "DMG ($DMG) oder Icon ($ICON) fehlt -> ueberspringe (Bau bleibt gueltig)."
            exit 0
          fi
          echo "Patche Volume-Icon in: $DMG"
          hdiutil convert "$DMG" -format UDRW -o rw.dmg -ov
          MNT=$(hdiutil attach rw.dmg -nobrowse -noautoopen | grep -o "/Volumes/.*" | head -1)
          cp "$ICON" "$MNT/.VolumeIcon.icns"
          SetFile -a C "$MNT"
          sync
          hdiutil detach "$MNT" || (sleep 3; hdiutil detach "$MNT" -force)
          hdiutil convert rw.dmg -format UDZO -imagekey zlib-level=9 -o patched.dmg -ov
          mv -f patched.dmg "$DMG"
          echo "Lade gepatchte Diskette ins Release (ueberschreibt das Asset)..."
          gh release upload "${{ inputs.version }}" "$DMG" --clobber --repo "${{ github.repository }}"
          echo "Fertig: Diskette traegt jetzt das Download-Abzeichen."
